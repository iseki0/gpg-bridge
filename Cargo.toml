[package]
name = "gpg-bridge"
version = "0.1.0"
edition = "2024"
description = "Session-scoped remote OpenPGP signing for Git, using a local GnuPG agent"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10"
tokio = { version = "1", features = ["full"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = false
codegen-units = 1
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
